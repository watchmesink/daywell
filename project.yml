name: Daywell
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
packages:
  BlockingCore:
    path: .
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  ScreenTimeExtension:
    type: app-extension
    platform: iOS
    sources:
      - Shared/ProtectionEnvironment.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/ScreenTime.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: BlockingCore
targets:
  Daywell:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).InstaBlock
        CODE_SIGN_ENTITLEMENTS: Config/ScreenTime.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Daywell
        DaywellAppGroup: $(APP_GROUP_IDENTIFIER)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: BlockingCore
      - target: ActivityMonitor
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: ActivityReport
  ActivityMonitor:
    templates: [ScreenTimeExtension]
    sources: [Extensions/ActivityMonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).InstaBlock.ActivityMonitor
    info:
      path: Config/Monitor-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Daywell Monitor
        DaywellAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitorExtension
  ShieldConfiguration:
    templates: [ScreenTimeExtension]
    sources:
      - Extensions/ShieldConfiguration
      - Shared/ShieldArtwork.xcassets
      - Shared/AsciiRest-LICENSE.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).InstaBlock.ShieldConfiguration
    info:
      path: Config/ShieldConfiguration-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Daywell Shield
        DaywellAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
  ShieldAction:
    templates: [ScreenTimeExtension]
    sources: [Extensions/ShieldAction]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).InstaBlock.ShieldAction
    info:
      path: Config/ShieldAction-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Daywell Actions
        DaywellAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
  ActivityReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - Extensions/ActivityReport
      - Shared/ReportContext.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).InstaBlock.ActivityReport
        CODE_SIGN_ENTITLEMENTS: Config/ScreenTime.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Config/Report-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Daywell Usage
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
schemes:
  Daywell:
    build:
      targets:
        Daywell: all
    run:
      config: Debug
    archive:
      config: Release
